id: mcp-sse-endpoint-unauthenticated

info:
  name: MCP Server - Legacy SSE Transport Without Authentication
  author: garag0l
  severity: medium
  description: |
    The server exposes the legacy MCP HTTP+SSE transport (`GET /sse` streams an `endpoint` event) without
    credentials. Anyone who can reach it can open a session and call tools. The SSE transport is deprecated
    in favor of Streamable HTTP. Detection only: reads the first 32 bytes of the stream (so the never-ending
    stream can't hang the scan) and disconnects.
  reference:
    - https://modelcontextprotocol.io/specification/2024-11-05/basic/transports
  classification:
    cwe-id: CWE-306
  metadata:
    verified: true
    max-request: 2
  tags: mcp,ai,llm,exposure,unauth,sse,misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/sse"
      - "{{BaseURL}}/mcp/sse"
    headers:
      Accept: text/event-stream

    stop-at-first-match: true
    max-size: 32

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: word
        part: header
        words:
          - "text/event-stream"
      - type: word
        part: body
        words:
          - "event: endpoint"
